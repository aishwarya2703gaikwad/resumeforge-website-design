<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Free Account | ResumeForge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: #818cf8;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            background-color: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .form-group label span {
            color: #f43f5e;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        select.form-control option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #4f46e5;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }

        .footer-text a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-card">
        <div class="header">
            <h1>Resume Forge</h1>
            <h2>Create Your Free Account</h2>
            <div class="badge">✓ Free at every level • No payment required</div>
        </div>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullName">Full Name <span>*</span></label>
                <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number <span>*</span></label>
                <input type="tel" id="mobile" class="form-control" placeholder="Enter your mobile number" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span>*</span></label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="qualification">Highest Qualification <span>*</span></label>
                <select id="qualification" class="form-control" required>
                    <option value="" disabled selected>Select your highest qualification</option>
                    <option value="10th">10th</option>
                    <option value="12th">12th</option>
                    <option value="Diploma">Diploma</option>
                    <option value="B.Tech/B.E">B.Tech / B.E</option>
                    <option value="B.Sc">B.Sc</option>
                    <option value="B.Com">B.Com</option>
                    <option value="BBA">BBA</option>
                    <option value="BCA">BCA</option>
                    <option value="M.Tech/M.E">M.Tech / M.E</option>
                    <option value="M.Sc">M.Sc</option>
                    <option value="M.Com">M.Com</option>
                    <option value="MBA">MBA</option>
                    <option value="MCA">MCA</option>
                    <option value="PhD">PhD</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password <span>*</span></label>
                <input type="password" id="password" class="form-control" placeholder="Create a password" minlength="6" required>
                <div class="hint">Password must contain at least 6 characters.</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password <span>*</span></label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" minlength="6" required>
            </div>

            <button type="submit" class="btn-submit">Create Free Account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="newprojectlogin.html">Log in</a>
        </div>
    </div>

</body>
</html>
